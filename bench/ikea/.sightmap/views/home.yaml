version: 1
views:
  - name: Home
    route: "/us/en/"
    url: https://www.ikea.com/us/en/
    description: >
      The US English home page. Nothing on it is needed for the bag flow beyond
      the header globals — start by searching from SearchField.
    memory:
      - >
        The home page carries product rails of its own, and BILLY, IKEA's
        best-known bookcase, often turns up in one. Those cards add whichever
        size the rail happens to show, so they are not a way to reach a named
        variant: search for the product, open its page from the results, and
        add it from there.
    components:
      - $ref: SurveyDialog
      - $ref: CookieBanner
      - $ref: SearchField
      - $ref: SearchSuggestion
      - $ref: SearchButton
      - $ref: BagLink
