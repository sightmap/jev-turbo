version: 1
views:
  - name: Home
    route: "/us/en/"
    url: https://www.ikea.com/us/en/
    description: >
      The US English home page: the header globals, the NavEntry menu links,
      and rails of featured products. Search from SearchField, or open
      NavEntry "Products" and take a MenuTab and a MenuLink into a Category
      view.
    memory:
      - >
        The product rails on this page add whichever size and colour the rail
        happens to show. To reach a named variant, search for it or open its
        category, then add it from the ProductCard whose title is the variant
        wanted.
    components:
      - $ref: SurveyDialog
      - $ref: CookieBanner
      - $ref: SearchField
      - $ref: SearchSuggestion
      - $ref: SearchButton
      - $ref: NavEntry
      - $ref: MenuTab
      - $ref: MenuLink
      - $ref: BagLink
