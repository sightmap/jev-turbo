version: 1
views:
  - name: Search
    route: "/us/en/search/**"
    url: https://www.ikea.com/us/en/search/?q=kallax%20shelf%20unit
    description: >
      Search results (/us/en/search/?q=...). A grid of ProductCards, most of
      them from the same series for a series-name query, so pick a card by its
      full title, not by the series name alone.
    memory:
      - >
        Every card's title starts with the series name and a comma; the part
        after it (Shelf unit / Bookcase / with doors, the colour and the size)
        is what tells the cards apart. The plain white KALLAX is "KALLAX,
        Shelf unit, white, 30 1/8x57 5/8 ".
    components:
      - $ref: SurveyDialog
      - $ref: CookieBanner
      - $ref: SearchField
      - $ref: SearchSuggestion
      - $ref: NavEntry
      - $ref: MenuTab
      - $ref: MenuLink
      - $ref: BagLink
      - $ref: ProductCard
