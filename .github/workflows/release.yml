name: release

# On every push to main:
#
#   1. version: while changesets are pending, changesets/action opens or
#      updates a "Version Packages" PR that bumps npm/package.json and writes
#      npm/CHANGELOG.md. Once that PR merges (no changesets left), this job
#      tags vX.Y.Z and pushes the tag. The Go module lives at the repo root,
#      so the bare tag is also the module version.
#
#   2. goreleaser: builds the six platform binaries and publishes a GitHub
#      release; the archives go to the npm job as a workflow artifact.
#
#   3. publish-npm: repackages the archives into @sightmap/jev-turbo-<os>-<arch>
#      and the @sightmap/jev-turbo meta package and publishes them with npm
#      trusted publishing (OIDC). No NPM_TOKEN secret.
#
# One-time npm setup (see RELEASING.md): the very first publish of each of
# the seven packages happens by hand, then a Trusted Publisher (GitHub
# Actions, repository "sightmap/jev-turbo", workflow "release.yml") is
# registered on each. Jobs 2 and 3 are gated on job 1's output rather than
# a tag trigger, because a tag pushed with GITHUB_TOKEN does not start
# another workflow. They no-op when the current version is already tagged.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Version Packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for unreleased version
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./npm/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged, nothing to release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"

  goreleaser:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.2'
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: dist-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: [version, goreleaser]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          name: dist-archives
          path: dist-archives
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Assemble npm packages
        run: node npm/scripts/build-npm-packages.mjs --version "${{ needs.version.outputs.version }}" --dist dist-archives --out npm-staging
      - name: Publish platform packages
        run: |
          for dir in npm-staging/@sightmap/*/; do
            echo "publishing $dir"
            ( cd "$dir" && npm publish )
          done
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Publish meta package
        run: cd npm-staging/meta && npm publish
        env:
          NPM_CONFIG_PROVENANCE: true
